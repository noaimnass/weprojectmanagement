    reference:
      description: "La méthode de pilotage : cycle de vie, éligibilité, classes, règles des signaux, gouvernance, registres et glossaire."
      method_title: "Méthode"
      method_text: "Chaque projet suivi dispose d'une fiche de pilotage (classe, catégorie, phase, acteurs, budget, dates), de revues de jalon sur un cycle de vie commun, de registres et d'un reporting cadencé validé par le PMO.\nLa santé du projet est double : déclarée par le chef de projet dans son rapport, et calculée à partir des signaux. Un écart entre les deux est un faux vert, visible dans le cockpit et la Tour de contrôle."
      lifecycle_text: "Cycle commun P0–P8 ; les libellés des jalons s'adaptent à chaque catégorie de projet (administration › Pilotage)."
      generic_label: "Libellé générique"
      eligibility_title: "Éligibilité au portefeuille"
      eligibility_text: "Une demande qui atteint l'un de ces seuils est qualifiée par le PMO puis décidée en Tour de contrôle ; un Go crée le projet en phase P0."
      months: "mois"
      classes_title: "Classes et cadence de reporting"
      rule: "Règle"
      class_a_rule: "≥ %{budget} M%{currency}, ou ≥ %{entities} entités et ≥ %{entities_budget} M%{currency}"
      class_b_rule: "≥ %{budget} M%{currency}, ou ≥ %{entities} entités et ≥ %{entities_budget} M%{currency}"
      class_c_rule: "En dessous des seuils de la classe B"
      signals_title: "Règles des signaux"
      health_text: "La santé calculée est le plus défavorable des quatre signaux. La santé déclarée est celle du dernier rapport validé."
      reporting_cycle: "Cycle mensuel du reporting : mise à jour des projets (J-15), validation PMO (J-10), revues de portefeuille (J-5), Tour de contrôle (J), diffusion du relevé de décisions (J+2)."
      rules:
        schedule:
          green: "Aucun jalon en retard, écart de fin nul, moins de 20 % des lots ouverts en retard"
          amber: "Jalon en retard de 1 à 15 jours, ou écart de fin positif, ou 20 à 40 % des lots en retard"
          red: "Jalon en retard de plus de 15 jours, ou écart de fin supérieur à 10 % de la durée, ou plus de 40 % des lots en retard"
        budget:
          green: "Consommation inférieure à 90 % et au plus 10 points au-dessus de l'avancement"
          amber: "Consommation de 90 % ou plus, ou 10 à 20 points au-dessus de l'avancement"
          red: "Consommation de 100 % ou plus, ou plus de 20 points au-dessus de l'avancement"
        risk:
          green: "Criticité maximale des risques ouverts inférieure à 10"
          amber: "Criticité maximale entre 10 et 15"
          red: "Criticité maximale de 16 ou plus"
        reporting:
          green: "Dernier rapport validé dans la cadence de la classe"
          amber: "Dernier rapport validé entre une et deux cadences"
          red: "Aucun rapport validé, ou dernier rapport au-delà de deux cadences"
      registers:
        risk: "Événements incertains évalués en probabilité × impact (1 à 5), avec plan de traitement et contingence."
        issue: "Problèmes avérés à résoudre, avec gravité et résolution."
        decision: "Décisions prises, rattachées à une instance et une séance."
        action: "Actions à mener avec responsable et échéance ; les relances du reporting y sont créées."
        change_request: "Demandes de changement avec impacts délais, budget et périmètre, instruites par le comité de contrôle des changements."
        deliverable: "Livrables attendus par phase, avec version et critères d'acceptation."
        benefit: "Bénéfices attendus avec indicateur, cible et mesure."
        stakeholder: "Parties prenantes avec rôle, influence et soutien."
        impact: "Impacts du changement par entité et population, avec niveau."
      glossary_title: "Glossaire"
      glossary:
        false_green:
          term: "Faux vert"
          definition: "Projet déclaré vert alors que ses signaux calculés sont rouges."
        baseline:
          term: "Référence"
          definition: "Fin de projet validée au cadrage, figée pour mesurer l'écart."
        control_tower:
          term: "Tour de contrôle"
          definition: "Instance mensuelle de pilotage du portefeuille qui arbitre et décide des demandes de projet."
        correspondent:
          term: "Correspondant PMO"
          definition: "Relais du PMO dans un ensemble ou un projet ; valide les mises à jour de son périmètre."
        class:
          term: "Classe"
          definition: "Niveau d'enjeu du projet (A, B, C) qui fixe la cadence du reporting."
        flash:
          term: "Flash report"
          definition: "Synthèse d'une page de la situation d'un projet."
        arbitration:
          term: "Arbitrage"
          definition: "Décision attendue d'une instance : point de blocage, demande de changement, demande de projet."

